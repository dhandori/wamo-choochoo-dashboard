<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WAMO | 데일리 마켓 레이더</title>
  <meta name="description" content="한국과 미국 시장의 52주 신고가권, 당일 신고가, 산업 동반 강세와 특징주">
  <link rel="stylesheet" href="./radar/style.css?v=20261024-dd3">
  <link rel="stylesheet" href="./radar/trend.css?v=20261026-sp1">
  <link rel="stylesheet" href="./radar/ftd.css?v=20261024-dd3">
  <link rel="stylesheet" href="./radar/leaders.css?v=20261024-dd3">
  <link rel="stylesheet" href="./radar/schedule.css?v=20261024-dd3">
  <link rel="stylesheet" href="./radar/light.css?v=20261026-ix1">
  <script>
(function(){
  var root=document.documentElement,store=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;};
  var q=new URLSearchParams(location.search).get("theme"),t=(q==="light"||q==="dark")?q:store("wamoTheme");
  if(t==="light")root.dataset.theme="light";
  document.addEventListener("DOMContentLoaded",function(){
    var b=document.createElement("button");b.type="button";b.className="theme-toggle";
    var sync=function(){var light=root.dataset.theme==="light";b.textContent=light?"어둡게":"밝게";b.setAttribute("aria-label",light?"어두운 화면으로 바꾸기":"밝은 화면으로 바꾸기");};
    b.addEventListener("click",function(){var next=root.dataset.theme==="light"?"dark":"light";if(next==="light")root.dataset.theme="light";else delete root.dataset.theme;store("wamoTheme",next);sync();});
    sync();var br=document.querySelector(".topbar .brand");if(br)br.after(b);else document.body.append(b);
  });
})();
</script>
<script data-goatcounter="https://wamo-dhandori.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="radar.html">WAMO <span>MARKET RADAR</span></a>
      <div class="market-switch" aria-label="시장 선택"><button data-market="KR">한국<span class="mk-code"> KR</span></button><button data-market="US">미국<span class="mk-code"> US</span></button><button data-market="JP">일본<span class="mk-code"> JP</span></button><button data-market="TW">대만<span class="mk-code"> TW</span></button></div>
    </header>
    <section class="intro">
      <div><div class="eyebrow">DAILY SCANNER</div><h1>데일리 마켓 레이더</h1></div>
      <div id="date-info" class="date-info"></div>
    </section>
    <section id="index-strip" class="ix-strip" aria-label="주요 지수" hidden></section>
    <section id="weather" class="tr-weather" aria-label="시장 날씨" hidden></section>
    <div id="notice" class="notice" hidden></div>
    <div id="metrics" class="metrics" aria-label="전체 스크리닝 대상 집계"></div>
    <div class="meta-row">
      <details class="disclosure"><summary id="coverage-summary">데이터 범위와 기준</summary><div id="coverage-detail"></div></details>
      <span class="color-legend" aria-label="색 안내"><i class="lg up"></i>상승 <i class="lg down"></i>하락 <i class="lg bad"></i>경고·나쁨 <i class="lg good"></i>좋음</span>
      <details id="schedule-wrap" class="schedule-wrap"><summary>갱신 일정·진행 상황</summary><section id="schedule" class="schedule" aria-label="갱신 일정과 진행 상황" hidden></section></details>
    </div>
    <nav class="tabs" aria-label="분석 화면">
      <div class="tab-group" aria-label="1단계 시장 판단"><span class="tab-group-label">① 시장</span><button data-tab="trend">추세 신호</button><button data-tab="ftd">시장 전환·FTD</button></div>
      <div class="tab-group" aria-label="2단계 주도 업종"><span class="tab-group-label">② 업종</span><button data-tab="leaders">선도주·선도업종</button><button data-tab="industries">인더스트리 액션</button><button data-tab="ai">AI 섹터</button></div>
      <div class="tab-group" aria-label="3단계 종목 찾기"><span class="tab-group-label">③ 종목</span><button data-tab="near">52주 신고가권</button><button data-tab="high">당일 신고가</button><button data-tab="movers">특징주</button></div>
    </nav>
    <section class="workspace">
      <div class="section-head">
        <div><h2 id="section-title"></h2><p id="section-description"></p></div>
        <label class="search"><span class="sr-only">종목 검색</span><input id="search" placeholder="종목명 · 티커 · 산업 검색" type="search"></label>
      </div>
      <section id="sp-movers" class="sp-movers" aria-label="S&amp;P 500 상승·하락 상위" hidden></section>
      <section id="ai-overview" class="ai-overview" aria-label="AI 분야별 흐름" hidden></section>
      <div id="controls" class="controls"></div>
      <div class="scanner-layout">
        <div class="primary"><div class="list-meta"><div class="result-tools"><div id="result-summary" class="result-summary"></div><div id="signal-filter"></div></div><details id="session-changes" class="session-changes"></details></div><div id="content" aria-live="polite"></div><div id="pagination" class="pagination"></div></div>
        <aside id="industry-rail" class="industry-rail" aria-label="산업 흐름"></aside>
      </div>
    </section>
    <footer>WAMO · 스크리닝 대상 내 비교입니다. 공시·뉴스는 관련 정보이며 주가 변동의 원인을 입증하지 않습니다.</footer>
  </div>
  <dialog id="drawer" aria-labelledby="stock-detail-title"><button id="close-drawer" class="close" aria-label="상세 닫기">×</button><div id="detail"></div></dialog>
  <!--WAMO_INSIGHTS-->
  <script type="module" src="./radar/view.js?v=20261026-sp1"></script>
</body>
</html>
