name: US KIS integration check
on:
  push:
    branches: ['codex/kis-us-connect-20260908']
    paths: ['wamo_kis.py', 'wamo_kis_us_check.py', '.github/workflows/kis-us-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wamo-data-update
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify master and 20 US quotes
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SEC: ${{ secrets.KIS_APP_SEC || secrets.KIS_APP_SECRET }}
        run: python -u wamo_kis_us_check.py
