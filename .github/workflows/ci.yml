name: WAMO 회귀검사
on:
  push:
    branches: ['codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test --test-isolation=none tests/discovery.test.mjs tests/status.test.mjs tests/insights.test.mjs tests/ai.test.mjs tests/ftd.test.mjs
      - run: node --check wamo_status.js
      - run: node --check wamo_discovery.js
      - run: node --check discovery/model.js
      - run: node --check discovery/store.js
      - run: node --check discovery/view.js
      - run: node --check discovery/detail.js
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python wamo_publish_insights.py
      - run: python tests/radar_browser.py
      # 같은 검사를 그날 실제 자료로 한 번 더 돌린다. 시장 상황·수집 실패로 깨질 수 있어 결과를 막지 않는다.
      - run: python tests/radar_browser.py
        env:
          WAMO_RADAR_LIVE: '1'
        continue-on-error: true
      - run: python tests/browser_smoke.py
      - run: python tests/discovery_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-check
          path: test-results/
          if-no-files-found: ignore
