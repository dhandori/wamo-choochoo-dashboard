name: WAMO Radar Sync
on:
  workflow_dispatch:
  schedule:
    # After global-high-radar publishes (17:40 / 06:40 KST), not every hour:
    # hourly runs shared the data-update queue and could delay close refreshes.
    # KR: 18:25, 20:25 KST
    - cron: '25 9,11 * * 1-5'
    # US: 08:25, 10:25 KST (Tue-Sat)
    - cron: '25 23 * * 1-5'
    - cron: '25 1 * * 2-6'
  push:
    branches: [main, 'codex/radar-integration']
    paths: ['wamo_radar.py', 'wamo_catalog.py', 'wamo_insights.py', 'wamo_publish_insights.py', 'radar.template.html', 'radar/**', '.github/workflows/radar-sync.yml']
permissions:
  contents: write
concurrency:
  group: wamo-data-update
  cancel-in-progress: false
  queue: max
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: 자료 브랜치 받기 (자료는 main이 아니라 data 브랜치에 있다)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 wamo_data_branch.py setup
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_radar_bridge.py -v
      - name: Recover missing market closes before rebuilding the screen
        id: close_recovery
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 75
        env:
          PYTHONUNBUFFERED: '1'
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SEC_USER_AGENT: ${{ secrets.SEC_CONTACT && format('WAMO-Market-Radar {0}', secrets.SEC_CONTACT) || secrets.SEC_USER_AGENT }}
          RADAR_READ_TOKEN: ${{ secrets.RADAR_READ_TOKEN }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SEC: ${{ secrets.KIS_APP_SEC || secrets.KIS_APP_SECRET }}
        run: |
          git config user.name wamo-dashboard-bot
          git config user.email actions@users.noreply.github.com
          python -u wamo_run.py --market auto --recovery --publish
      - name: Persist an interrupted recovery without changing price dates
        if: always() && steps.close_recovery.outcome == 'failure'
        timeout-minutes: 3
        run: python wamo_run.py --finalize-interrupted --publish
      - name: Build independent market radar from verified price histories
        run: python wamo_publish_insights.py
      - name: Update optional related headlines
        continue-on-error: true
        timeout-minutes: 3
        run: python wamo_news.py
      - name: Embed available related headlines
        run: python wamo_publish_insights.py
      - name: Import only validated public candidate and industry fields
        env:
          RADAR_READ_TOKEN: ${{ secrets.RADAR_READ_TOKEN }}
        run: python wamo_radar.py
      - name: Rebuild public WAMO catalog
        if: always()
        run: python wamo_catalog.py
      - name: Save verified results or explicit failure status
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f wamo_radar.json || exit 0
          if [ "${GITHUB_REF}" = refs/heads/main ]; then
            python3 wamo_data_branch.py publish -m 'Refresh validated global discovery results' \
              wamo_radar.json wamo_catalog.json wamo_insights.json radar.html index.html us.html wamo_news.json
            exit 0
          fi
          git config user.name wamo-dashboard-bot
          git config user.email actions@users.noreply.github.com
          git add -- wamo_radar.json wamo_catalog.json wamo_insights.json radar.html index.html us.html
          if test -f wamo_news.json; then git add -- wamo_news.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh validated global discovery results'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Report a failed close recovery after preserving verified data
        if: always() && steps.close_recovery.outcome == 'failure'
        run: exit 1
