name: WAMO 매크로 지수
# 다른 WAMO 갱신과 섞이지 않도록 별도 대기 줄(wamo-macro)에서 혼자 돈다.
# 바꾸는 파일은 wamo_macro.json / wamo_macro_history.json 두 개뿐이다.
# 화면은 산업강도판(dhandori/industry-strength) 세 번째 탭이 이 JSON을 읽어 그린다.
on:
  workflow_dispatch:
  schedule:
    # 한국 시간 월~토 아침 07:05 (미국장 마감·한국 전일 금리 반영 후)
    - cron: '5 22 * * 0-5'
    # 한국 시간 월~금 저녁 06:30 (한국장 마감 뒤 당일 한국 금리·VKOSPI 반영, 알림 없이 화면만 갱신)
    - cron: '30 9 * * 1-5'
  push:
    branches: [main]
    paths: ['wamo_macro.py', '.github/workflows/macro.yml']
permissions:
  contents: write
concurrency:
  group: wamo-macro
  cancel-in-progress: false
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: 자료 브랜치 받기 (자료는 main이 아니라 data 브랜치에 있다)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 wamo_data_branch.py setup
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2
      - name: 매크로 지수 계산
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SEC: ${{ secrets.KIS_APP_SEC || secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 알림은 아침 실행(07:05)과 수동 실행에서만 보낸다. 저녁 실행(18:30)과 코드 수정 실행은 화면만 갱신
          SEND: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '5 22 * * 0-5')) && '--telegram' || '' }}
        run: python wamo_macro.py $SEND
      - name: 결과 올리기 (data 브랜치. 다른 작업이 먼저 올렸으면 받아서 다시 시도)
        run: python3 wamo_data_branch.py publish -m "매크로 지수 갱신 $(TZ=Asia/Seoul date +%F)" wamo_macro.json wamo_macro_history.json
