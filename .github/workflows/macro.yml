name: WAMO 매크로 지수
# 다른 WAMO 갱신과 섞이지 않도록 별도 대기 줄(wamo-macro)에서 혼자 돈다.
# 바꾸는 파일은 wamo_macro.json / wamo_macro_history.json 두 개뿐이다.
# 화면은 산업강도판(dhandori/industry-strength) 세 번째 탭이 이 JSON을 읽어 그린다.
on:
  workflow_dispatch:
  schedule:
    # 한국 시간 월~토 아침 07:05 (미국장 마감·한국 전일 금리 반영 후)
    - cron: '5 22 * * 0-5'
  push:
    branches: [main]
    paths: ['wamo_macro.py', '.github/workflows/macro.yml']
permissions:
  contents: write
concurrency:
  group: wamo-macro
  cancel-in-progress: false
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2
      - name: 매크로 지수 계산
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SEC: ${{ secrets.KIS_APP_SEC || secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 코드를 고쳐 올렸을 때는 알림을 보내지 않고, 정해진 아침 실행과 수동 실행에서만 보낸다
          SEND: ${{ github.event_name != 'push' && '--telegram' || '' }}
        run: python wamo_macro.py $SEND
      - name: 결과 올리기 (다른 작업이 먼저 올렸으면 받아서 다시 시도)
        run: |
          git config user.name "wamo-bot"
          git config user.email "wamo-bot@users.noreply.github.com"
          git add wamo_macro.json wamo_macro_history.json
          git diff --cached --quiet && { echo "바뀐 내용 없음"; exit 0; }
          git commit -m "매크로 지수 갱신 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
