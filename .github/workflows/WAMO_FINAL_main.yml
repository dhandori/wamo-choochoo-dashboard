name: WAMO 자동갱신

on:
  workflow_dispatch:
  schedule:
    # 한국장 장중 12:00 KST (03:00 UTC), 월~금
    - cron: '0 3 * * 1-5'
    # 한국장 종료 후 16:00 KST (07:00 UTC), 월~금
    - cron: '0 7 * * 1-5'
    # 미국장 장중 00:00 KST (15:00 UTC), 한국 기준 화~토 / UTC 월~금
    - cron: '0 15 * * 1-5'
    # 미국장 종료 후 05:00 KST (20:00 UTC), 한국 기준 화~토 / UTC 월~금
    - cron: '0 20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: wamo-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 파일 가져오기
        uses: actions/checkout@v6

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 필요한 도구 설치
        run: pip install pandas openpyxl xlrd lxml html5lib beautifulsoup4 requests

      - name: Git 저장 준비
        run: |
          git config user.name "wamo-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: 한국 투자 데이터 갱신
        id: update_korea
        if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 3 * * 1-5' || github.event.schedule == '0 7 * * 1-5')
        continue-on-error: true
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python wamo_update_business_dart.py

      - name: 한국 상승률 TOP 30 갱신
        id: movers_korea
        if: steps.update_korea.outcome == 'success'
        continue-on-error: true
        run: python wamo_update_movers.py --market korea

      - name: 한국 결과 즉시 저장
        id: save_korea
        if: steps.update_korea.outcome == 'success'
        continue-on-error: true
        run: |
          git add index.html
          if [ -f wamo_business_profiles.json ]; then git add wamo_business_profiles.json; fi
          if [ -f movers.html ]; then git add movers.html; fi
          if [ -f wamo_movers_cache.json ]; then git add wamo_movers_cache.json; fi
          git diff --cached --quiet || git commit -m "auto update Korea dashboard and movers"
          git push

      - name: 미국 투자 데이터 갱신
        id: update_us
        if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 15 * * 1-5' || github.event.schedule == '0 20 * * 1-5')
        continue-on-error: true
        run: python wamo_update_us_sec.py

      - name: 미국 상승률 TOP 30 갱신
        id: movers_us
        if: steps.update_us.outcome == 'success'
        continue-on-error: true
        run: python wamo_update_movers.py --market us

      - name: 미국 결과 즉시 저장
        id: save_us
        if: steps.update_us.outcome == 'success'
        continue-on-error: true
        run: |
          git add us.html
          if [ -f wamo_us_sec_cache.json ]; then git add wamo_us_sec_cache.json; fi
          if [ -f movers.html ]; then git add movers.html; fi
          if [ -f wamo_movers_cache.json ]; then git add wamo_movers_cache.json; fi
          git diff --cached --quiet || git commit -m "auto update US dashboard and movers"
          git push

      - name: 최종 갱신 결과 확인
        if: always()
        run: |
          echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          echo "한국 계산: ${{ steps.update_korea.outcome }} / 상승률: ${{ steps.movers_korea.outcome }} / 저장: ${{ steps.save_korea.outcome }}"
          echo "미국 계산: ${{ steps.update_us.outcome }} / 상승률: ${{ steps.movers_us.outcome }} / 저장: ${{ steps.save_us.outcome }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ steps.update_korea.outcome }}" = "success" ] && [ "${{ steps.movers_korea.outcome }}" = "success" ] && [ "${{ steps.save_korea.outcome }}" = "success" ] && [ "${{ steps.update_us.outcome }}" = "success" ] && [ "${{ steps.movers_us.outcome }}" = "success" ] && [ "${{ steps.save_us.outcome }}" = "success" ] || exit 1
          elif [ "${{ github.event.schedule }}" = "0 3 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 7 * * 1-5" ]; then
            [ "${{ steps.update_korea.outcome }}" = "success" ] && [ "${{ steps.movers_korea.outcome }}" = "success" ] && [ "${{ steps.save_korea.outcome }}" = "success" ] || exit 1
          elif [ "${{ github.event.schedule }}" = "0 15 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 20 * * 1-5" ]; then
            [ "${{ steps.update_us.outcome }}" = "success" ] && [ "${{ steps.movers_us.outcome }}" = "success" ] && [ "${{ steps.save_us.outcome }}" = "success" ] || exit 1
          fi
