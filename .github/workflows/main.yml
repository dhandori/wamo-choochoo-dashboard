name: WAMO 자동갱신

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: wamo-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 파일 가져오기
        uses: actions/checkout@v6

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 필요한 도구 설치
        run: pip install pandas openpyxl xlrd lxml html5lib beautifulsoup4 requests

      - name: Git 저장 준비
        run: |
          git config user.name "wamo-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: 한국 투자 데이터 갱신
        id: update_korea
        continue-on-error: true
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python wamo_update_business_dart.py

      - name: 한국 결과 즉시 저장
        id: save_korea
        if: steps.update_korea.outcome == 'success'
        continue-on-error: true
        run: |
          git add index.html
          if [ -f wamo_business_profiles.json ]; then git add wamo_business_profiles.json; fi
          git diff --cached --quiet || git commit -m "auto update Korea dashboard"
          git push

      - name: 미국 투자 데이터 갱신
        id: update_us
        continue-on-error: true
        run: python wamo_update_us_sec.py

      - name: 미국 결과 즉시 저장
        id: save_us
        if: steps.update_us.outcome == 'success'
        continue-on-error: true
        run: |
          git add us.html
          if [ -f wamo_us_sec_cache.json ]; then git add wamo_us_sec_cache.json; fi
          git diff --cached --quiet || git commit -m "auto update US dashboard"
          git push

      - name: 최종 갱신 결과 확인
        if: always()
        run: |
          echo "한국 계산: ${{ steps.update_korea.outcome }} / 저장: ${{ steps.save_korea.outcome }}"
          echo "미국 계산: ${{ steps.update_us.outcome }} / 저장: ${{ steps.save_us.outcome }}"
          if [ "${{ steps.update_korea.outcome }}" != "success" ] || [ "${{ steps.save_korea.outcome }}" != "success" ] || [ "${{ steps.update_us.outcome }}" != "success" ] || [ "${{ steps.save_us.outcome }}" != "success" ]; then
            echo "한 시장 이상 계산 또는 저장에 실패했습니다. 성공한 시장 결과는 이미 별도로 저장했습니다."
            exit 1
          fi
