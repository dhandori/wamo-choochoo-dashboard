name: WAMO 자동갱신

on:
  schedule:
    # Publication slots: KR 15:50 KST, US 16:10 New York (wamo_runtime.SLOTS).
    # GitHub starts schedules 10-40 minutes late, so these start early and
    # wamo_wait.py holds the run until the slot (KR 15:20/15:35 KST;
    # US 15:35/15:50 ET in daylight time, 20:35/20:50 UTC in standard time).
    - cron: '20,35 6 * * 1-5'
    - cron: '35,50 19,20 * * 1-5'
    # Former exact-slot starts stay as backups; wamo_run.py permits only one
    # collection per market trading session, so these exit if already done.
    - cron: '0 7 * * 1-5'
    - cron: '20 20 * * 1-5'
    - cron: '20 21 * * 1-5'
    # Every 30 minutes through both close/recovery windows (UTC).
    # KR: 16:11-22:41 KST. US: 05:11-12:41 KST, both DST variants.
    # The calendar/session guard skips holidays and already collected closes.
    - cron: '11,41 0-3,7-13,20-23 * * *'
    # GitHub often delays or drops on-the-hour schedules. Extra off-minute
    # checks right after each close keep the delay to a few minutes; runs for
    # an already collected session exit before any provider call.
    - cron: '4,17,24,34,47,54 7 * * 1-5'
    - cron: '4,17,27,34,47,54 20-22 * * 1-5'
    # US index volume from Yahoo is preliminary right after the close and is revised
    # later in the Korean afternoon. Recalculate US trend with the final volume at
    # 18:10 KST, and once more at 21:10 KST only if it was still preliminary.
    - cron: '10 9 * * 2-6'
    - cron: '10 12 * * 2-6'
  workflow_dispatch:
    inputs:
      market:
        description: 갱신할 시장
        type: choice
        default: both
        options: [both, KR, US]
      publish:
        description: 검증 결과를 실제 게시 (대시보드 '지금 갱신'은 켠 상태로 실행)
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['wamo_*.py', 'wamo_status.js', 'requirements.txt', '.github/workflows/main.yml']

permissions:
  contents: write
  actions: write   # 마지막 단계에서 밀린 일본·대만 갱신(asia.yml)을 깨운다

concurrency:
  group: wamo-${{ github.event_name == 'push' && 'code-check' || 'data-update' }}
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 최신 파일 가져오기
        uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          ref: main
          fetch-depth: 1
      - name: 자료 브랜치 받기 (자료는 main이 아니라 data 브랜치에 있다)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 wamo_data_branch.py setup
      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 도구 설치
        timeout-minutes: 10
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 코드 변경 전체 회귀검사
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests -v
      - name: 예약 갱신 핵심검사
        if: github.event_name == 'schedule'
        timeout-minutes: 5
        run: >-
          python -m unittest -v
          tests.test_refresh.RefreshTests.test_korean_close_runs_once_after_close
          tests.test_refresh.RefreshTests.test_us_dst_standard_time_and_early_close
          tests.test_refresh.RefreshTests.test_two_us_cron_candidates_publish_only_once_per_session
          tests.test_refresh.RefreshTests.test_prices_do_not_become_fresh_by_advancing_update_timestamp
          tests.test_refresh.RefreshTests.test_provider_failure_restores_output
      - name: Git 저장 준비
        if: github.event_name != 'push'
        run: |
          git config user.name 'wamo-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
      - name: 시장별 갱신·최신성 검증·결과 저장
        id: refresh
        if: github.event_name != 'push'
        timeout-minutes: 75
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SEC_USER_AGENT: ${{ secrets.SEC_CONTACT && format('WAMO-Market-Radar {0}', secrets.SEC_CONTACT) || secrets.SEC_USER_AGENT }}
          RADAR_READ_TOKEN: ${{ secrets.RADAR_READ_TOKEN }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SEC: ${{ secrets.KIS_APP_SEC || secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REQUESTED_MARKET: ${{ inputs.market || 'auto' }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          PUBLISH_RESULT: ${{ inputs.publish || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          market="$REQUESTED_MARKET"
          recovery=''
          if [[ "${GITHUB_EVENT_NAME}" == 'schedule' ]]; then
            case "$EVENT_SCHEDULE" in
              '20,35 6 * * 1-5') market='KR'; python -u wamo_wait.py --market KR ;;
              '35,50 19,20 * * 1-5') market='US'; python -u wamo_wait.py --market US ;;
              '0 7 * * 1-5') market='KR' ;;
              '20 20 * * 1-5'|'20 21 * * 1-5') market='US' ;;
              *) market='auto'; recovery='yes' ;;
            esac
          fi
          if [[ "$EVENT_SCHEDULE" == '10 9 * * 2-6' || "$EVENT_SCHEDULE" == '10 12 * * 2-6' ]]; then
            slot=$([[ "$EVENT_SCHEDULE" == '10 9 * * 2-6' ]] && echo first || echo second)
            args=(--confirm-volume "$slot")
            if [[ "$PUBLISH_RESULT" == 'true' ]]; then args+=(--publish); fi
            python -u wamo_run.py "${args[@]}"
            exit 0
          fi
          args=(--market "$market")
          if [[ -n "$recovery" ]]; then args+=(--recovery); fi
          if [[ "$PUBLISH_RESULT" == 'true' ]]; then args+=(--publish); fi
          python -u wamo_run.py "${args[@]}"
      - name: 중단된 실행 상태 정리
        if: always() && steps.refresh.outcome != 'skipped' && github.event_name != 'push'
        timeout-minutes: 3
        env:
          PUBLISH_RESULT: ${{ inputs.publish || github.event_name == 'schedule' }}
        run: |
          args=(--finalize-interrupted)
          if [[ "$PUBLISH_RESULT" == 'true' ]]; then args+=(--publish); fi
          python wamo_run.py "${args[@]}"
      # GitHub 예약이 몇 시간씩 늦거나 빠지는 날(2026-11-02 일본·대만 예약이 하루 종일 안 돎) 대비.
      # 이 작업은 하루 수십 번 돌므로, 끝날 때 일본·대만이 아직 반영 안 됐으면 asia.yml 을 한 번 깨운다.
      # asia.yml 예약과 같은 시간대(평일 07:40~23:59 UTC)에만, 최근 25분 안에 돈 적이 없을 때만 깨운다.
      - name: 밀린 일본·대만 갱신 깨우기
        if: always() && github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dow=$(date -u +%u); hm=$(date -u +%H%M)
          if (( dow > 5 )) || (( 10#$hm < 740 )); then echo "일본·대만 갱신 시간대 아님"; exit 0; fi
          pending=$(python wamo_asia.py --pending) || { echo "반영 여부 확인 실패 · 건너뜀"; exit 0; }
          if [[ "$pending" == "[]" ]]; then echo "일본·대만 최신"; exit 0; fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/asia.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""')
          if [[ -n "$last" ]] && (( $(date -u +%s) - $(date -u -d "$last" +%s) < 1500 )); then
            echo "일본·대만 미반영 $pending · 최근 실행($last)이 25분 안이라 건너뜀"; exit 0
          fi
          echo "일본·대만 미반영 $pending · asia.yml 실행"
          gh workflow run asia.yml --ref main
      - name: 실패 결과 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: |
            wamo_refresh_status.json
            wamo_refresh_state.json
          if-no-files-found: ignore
          retention-days: 7
