name: WAMO 자동갱신

on:
  workflow_dispatch:
    inputs:
      market:
        description: 갱신할 시장
        type: choice
        default: both
        options: [both, KR, US]
  push:
    branches: [main]
    paths: ['wamo_*.py', 'wamo_status.js', 'requirements.txt', '.github/workflows/main.yml']
  schedule:
    # UTC. KST 한국 평일 12:00 / 16:00, 미국 화~토 00:00 / 06:20.
    - cron: '0 3 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '20 21 * * 1-5'
    # Completed slots never rerun. Off-hour checks recover missed slots.
    - cron: '17,47 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: wamo-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 최신 파일 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 도구 설치
        run: python -m pip install -r requirements.txt
      - name: 갱신 회귀검사
        run: python -m unittest discover -s tests -v
      - name: Git 저장 준비
        run: |
          git config user.name 'wamo-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
      - name: 시장별 갱신·최신성 검증·결과 저장
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SEC: ${{ secrets.KIS_APP_SEC || secrets.KIS_APP_SECRET }}
          REQUESTED_MARKET: ${{ inputs.market || 'auto' }}
        run: python -u wamo_run.py --market "$REQUESTED_MARKET" --publish
      - name: 실패 결과 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: |
            wamo_refresh_status.json
            wamo_refresh_state.json
          if-no-files-found: ignore
          retention-days: 7
