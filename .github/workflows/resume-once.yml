name: WAMO 재개 1회 검증·갱신

# Runs only when this recovery file changes; daily updates live in main.yml.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/resume-once.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wamo-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 최신 파일 가져오기
        uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          ref: main
          fetch-depth: 1
      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 도구 설치
        timeout-minutes: 10
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 코드 변경 전체 회귀검사
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests -v
      - name: 예약 갱신 핵심검사
        if: github.event_name == 'schedule'
        timeout-minutes: 5
        run: >-
          python -m unittest -v
          tests.test_refresh.RefreshTests.test_korean_close_runs_once_at_1600_kst
          tests.test_refresh.RefreshTests.test_us_dst_standard_time_and_early_close
          tests.test_refresh.RefreshTests.test_two_us_cron_candidates_publish_only_once_per_session
          tests.test_refresh.RefreshTests.test_prices_do_not_become_fresh_by_advancing_update_timestamp
          tests.test_refresh.RefreshTests.test_provider_failure_restores_output
      - name: Git 저장 준비
        run: |
          git config user.name 'wamo-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
      - name: 시장별 갱신·최신성 검증·결과 저장
        id: refresh
        timeout-minutes: 40
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SEC: ${{ secrets.KIS_APP_SEC || secrets.KIS_APP_SECRET }}
          REQUESTED_MARKET: KR
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          PUBLISH_RESULT: 'true'
        run: |
          set -euo pipefail
          market="$REQUESTED_MARKET"
          if [[ "${GITHUB_EVENT_NAME}" == 'schedule' ]]; then
            if [[ "$EVENT_SCHEDULE" == '0 7 * * 1-5' ]]; then market='KR'; else market='US'; fi
          fi
          args=(--market "$market")
          if [[ "$PUBLISH_RESULT" == 'true' ]]; then args+=(--publish); fi
          # Repair only Korean auxiliary fields after endpoint connectivity passed.
          # Keep the verified close, price histories and daily refresh state intact.
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from datetime import datetime
          import wamo_update_business_dart as core
          import wamo_kis
          import wamo_run
          from wamo_runtime import UTC, expected_session, validate_freshness, write_json
          page = Path('index.html')
          html = page.read_text()
          data = core.extract_old_payload(html)
          target = expected_session('KR')
          assert data['meta']['asOf'] == target
          def prices():
              return json.dumps([(s['ticker'], s['date'], s['close'], s['history']) for s in data['stocks']], sort_keys=True)
          before = prices()
          listed = core.fetch_market_summary(0, '.KS', 'KOSPI') + core.fetch_market_summary(1, '.KQ', 'KOSDAQ')
          histories = {s['stock_code']: s['history'] for s in data['stocks']}
          energy = core.build_market_energy(listed, histories, data['meta'].get('marketEnergy') or {}, target)
          assert energy['status'] == 'LIVE', 'Official market energy not verified'
          data['meta']['marketEnergy'] = energy
          data['meta']['kisMeta'] = wamo_kis.enrich(data['stocks'])
          assert data['meta']['kisMeta']['connected'], 'KIS enrichment connection not verified'
          assert before == prices(), 'Auxiliary repair changed market prices'
          fresh = validate_freshness(data, 'KR')
          core.validate_payload_integrity(data)
          status = json.loads(Path('wamo_refresh_status.json').read_text())
          status['KR'].update(status='WARNING' if fresh['warnings'] else 'PASS', warnings=fresh['warnings'],
              freshness=fresh, kis=data['meta']['kisMeta'], auxiliaryCheckedAt=datetime.now(UTC).isoformat())
          page.write_text(core.replace_payload(html, data))
          write_json(Path('wamo_refresh_status.json'), status)
          wamo_run.publish(['index.html', 'wamo_refresh_status.json', 'wamo_kis_cache.json', 'wamo_kis_estimate_history.json'])
          print('KR auxiliary repair', status['KR']['status'], 'energy', energy['status'], 'KIS', data['meta']['kisMeta']['status'], flush=True)
          PY
      - name: 보조 연결 오류 유형 확인
        if: always()
        timeout-minutes: 3
        env:
          PYTHONPATH: .
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SEC: ${{ secrets.KIS_APP_SEC || secrets.KIS_APP_SECRET }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        shell: python
        run: |
          import urllib.error, urllib.parse
          from wamo_kis import KIS
          from wamo_update_business_dart import _krx_login_opener, _fetch_krx_index_members
          from wamo_runtime import expected_session
          for name, check in [('KIS', KIS().authenticate), ('KRX', _krx_login_opener), ('KRX_MEMBERS', lambda: _fetch_krx_index_members(_krx_login_opener(), '1028', expected_session('KR')))]:
              try:
                  check()
                  print(name, 'CONNECTED', flush=True)
              except urllib.error.HTTPError as exc:
                  location = urllib.parse.urlsplit(exc.headers.get('Location', ''))
                  print(name, 'HTTP', exc.code, 'redirect_host', location.hostname, 'redirect_path', location.path, flush=True)
              except Exception as exc:
                  print(name, 'ERROR_TYPE', type(exc).__name__, flush=True)
      - name: 공개 검색 카탈로그 별도 갱신·저장
        if: success()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python wamo_catalog.py
          git add -- wamo_catalog.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh public WAMO search catalog'
          git push origin HEAD:main
      - name: 실패 결과 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: |
            wamo_refresh_status.json
            wamo_refresh_state.json
          if-no-files-found: ignore
          retention-days: 7
