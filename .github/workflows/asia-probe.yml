name: 일본·대만 시세 출처 점검
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 일본·대만 시세 받아 보기
        run: python -u wamo_asia_probe.py
