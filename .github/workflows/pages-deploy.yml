name: Pages 배포
# Pages 설정(Source)이 'GitHub Actions'일 때만 사이트를 내보낸다.
# 지금처럼 'main 브랜치에서 바로 내보내기'이면 첫 단계에서 "해당 없음"으로 멈추고 아무것도 하지 않는다.
# 설정을 바꾸는 순간부터 따로 손대지 않아도 저절로 켜진다.
#
# 자료 갱신 작업들은 기본 토큰(GITHUB_TOKEN)으로 올린다. 그 방식으로 올린 변경은 push 이벤트를
# 만들지 못하므로, 그 작업들이 끝날 때(workflow_run) 배포를 이어서 건다.
# 사람이 main에 합칠 때는 push로 걸린다.
on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - WAMO 자동갱신
      - WAMO Radar Sync
      - 일본·대만 자동갱신
      - WAMO 매크로 지수
      - WAMO 재개 1회 검증·갱신
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나만. 기다리는 동안 새 요청이 쌓이면 가장 최신 하나만 남는다.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  guard:
    name: 설정 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      active: ${{ steps.mode.outputs.active }}
    steps:
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=unknown
          for i in 1 2 3; do
            if kind=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null) && [ -n "$kind" ]; then break; fi
            kind=unknown
            sleep 3
          done
          echo "Pages 배포 방식: $kind"
          case "$kind" in
            workflow)
              echo "active=true" >> "$GITHUB_OUTPUT" ;;
            unknown)
              # 읽지 못했을 때는 배포를 시도한다. 사이트가 멈춰 굳는 쪽이 더 나쁘기 때문이다.
              echo "::warning::Pages 설정을 읽지 못해 배포를 시도합니다"
              echo "active=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Source가 'GitHub Actions'가 아니라서 이번에는 배포하지 않습니다."
              echo "active=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: 꾸러미 만들기
    needs: guard
    if: needs.guard.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: 사이트에 올라갈 파일만 골라 담기
        run: python3 -I tools/pages_package.py build . _site --manifest manifest.json
      - name: 포장
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    name: 내보내기
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
