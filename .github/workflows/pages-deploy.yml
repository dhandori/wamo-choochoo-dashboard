name: Pages 배포
# Pages 설정(Source)이 'GitHub Actions'일 때만 사이트를 내보낸다.
# 지금처럼 'main 브랜치에서 바로 내보내기'이면 첫 단계에서 "해당 없음"으로 멈추고 아무것도 하지 않는다.
# 설정을 바꾸는 순간부터 따로 손대지 않아도 저절로 켜진다.
#
# 언제 걸리나
#  - 자료 갱신 작업 5개가 끝날 때(workflow_run). 그 작업들은 기본 토큰(GITHUB_TOKEN)으로 올리는데,
#    그렇게 올린 변경은 push 이벤트를 만들지 못하기 때문이다.
#  - 사람이 main에 합칠 때(push).
#  - 한 시간에 한 번(schedule). 누가 작업 이름을 바꿔 위 연결이 끊겨도 사이트가 한 시간 넘게 묵지 않게 하는 안전망이다.
#  - 손으로(workflow_dispatch). main에서만 된다.
on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - WAMO 자동갱신
      - WAMO Radar Sync
      - 일본·대만 자동갱신
      - WAMO 매크로 지수
      - WAMO 재개 1회 검증·갱신
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: 설정 확인
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      active: ${{ steps.mode.outputs.active }}
    steps:
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=""
          err=""
          for i in 1 2 3 4 5; do
            if out=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>&1) && [ -n "$out" ]; then
              kind="$out"
              break
            fi
            err="$out"
            case "$err" in
              *"HTTP 404"*|*"Not Found"*) kind=missing; break ;;
            esac
            sleep $((i * 3))
          done
          echo "Pages 배포 방식: ${kind:-읽지 못함}"
          case "$kind" in
            workflow)
              echo "active=true" >> "$GITHUB_OUTPUT" ;;
            "")
              # 읽지 못했을 때는 배포를 시도한다. 사이트가 조용히 멈춰 굳는 쪽이 더 나쁘기 때문이다.
              echo "::warning::Pages 설정을 읽지 못해 배포를 시도합니다. 마지막 오류: $err"
              echo "active=true" >> "$GITHUB_OUTPUT" ;;
            missing)
              echo "Pages가 꺼져 있어 배포하지 않습니다."
              echo "active=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Source가 'GitHub Actions'가 아니라서 이번에는 배포하지 않습니다."
              echo "active=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # 꾸러미 만들기와 내보내기를 한 작업에 둔다. 따로 두면 먼저 만든 오래된 꾸러미가 나중에 올라가
  # 사이트가 되돌아갈 수 있다. 대기열(concurrency)은 여기에만 걸어서, 설정을 바꾸기 전에는 생기지 않는다.
  publish:
    name: 꾸러미 만들어 내보내기
    needs: guard
    if: needs.guard.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      # 자료 분리: 코드(main)에 자료 브랜치(data)를 더해 꾸러미를 만든다. 같은 경로가 양쪽에 있으면 data 쪽을 쓴다
      # (main에 남은 옛 자료 사본보다 data의 최신 자료가 맞다). 자료를 못 받으면 여기서 멈추고 이전 사이트가 남는다.
      - name: 자료 브랜치 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            rm -rf "$RUNNER_TEMP/wamo-data"
            git clone --depth=1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/wamo-data" && exit 0
            echo "자료 브랜치 받기 실패($i/3)"; sleep $((i * 5))
          done
          exit 1
      - name: 사이트에 올라갈 파일만 골라 담기 (비었거나 일부만 담기면 여기서 멈춘다)
        run: >-
          python3 -I tools/pages_package.py build . _site --manifest manifest.json
          --overlay "$RUNNER_TEMP/wamo-data" --on-duplicate overlay
          --min-files 100 --require index.html:10000 --require us.html:10000 --require radar.html:10000
      - name: 포장
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - id: deployment
        name: 내보내기
        uses: actions/deploy-pages@v5
