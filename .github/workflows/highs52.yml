name: 52주 신고가 공통 계산
# 2026-10-31 사용자 결정: 52주 신고가를 노션 기록과 같은 기준(한국 시총 1,000억 원·미국 20억 달러 이상,
# 장중 고가가 1년 최고가에 닿음) 하나로 한 번만 계산한다. 결과는 data 브랜치의 wamo_highs52.json.
# 처음에는 노션 기록과 나란히 돌려 비교만 한다(shadow 칸). 화면·노션이 이 결과를 읽게 바꾸는 것은 비교 뒤에 한다.
on:
  schedule:
    # 2026-10-31 사용자: 마감 뒤 최대한 빨리. 마감 직전에 출발해 스크립트가 종가가 자리 잡을 때까지 기다린다
    # (한국 15:52 KST, 미국 뉴욕 16:08). Claude 마감 갱신 예약(한국 15:50·뉴욕 16:12)도 이 작업을 함께 건다.
    # 한국: 15:45 출발, 16:15·16:45 재시도(노션 기록 16:05 뒤라 비교 칸도 여기서 채운다)
    - cron: '45 6 * * 1-5'
    - cron: '15 7 * * 1-5'
    - cron: '45 7 * * 1-5'
    # 미국: 뉴욕 16:05 출발(UTC 20시 = 여름, 21시 = 겨울; 맞지 않는 쪽은 전날로 판단해 바로 끝남), 16:30 재시도
    - cron: '5 20,21 * * 1-5'
    - cron: '30 20,21 * * 1-5'
    # 미국 노션 비교 칸 채우기: 08:30 KST(노션 기록 08:05 뒤)
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: 계산할 시장 (auto = 지금 한국시간으로 판단)
        type: choice
        default: auto
        options: [auto, KR, US]
      day:
        description: 기준일 YYYY-MM-DD (비우면 가장 최근에 끝난 거래일)
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: wamo-data-update
  cancel-in-progress: false
  queue: max
jobs:
  highs52:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: 자료 브랜치 받기 (자료는 main이 아니라 data 브랜치에 있다)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 wamo_data_branch.py setup
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_highs52 -v
      - name: 52주 신고가 계산
        env:
          PYTHONUNBUFFERED: '1'
          RADAR_READ_TOKEN: ${{ secrets.RADAR_READ_TOKEN }}
          MARKET: ${{ inputs.market || 'auto' }}
          DAY: ${{ inputs.day || '' }}
        run: |
          if [ -n "$DAY" ]; then python wamo_highs52.py --market "$MARKET" --day "$DAY" --force
          else python wamo_highs52.py --market "$MARKET"; fi
      - name: data 브랜치에 올리기
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 wamo_data_branch.py publish -m '52주 신고가 공통 계산' wamo_highs52.json
