name: 일본·대만 자동갱신
on:
  schedule:
    # 16:40 KST: Taiwan (13:30 local) and Japan (15:30 JST) have both closed.
    - cron: '40 7 * * 1-5'
    # Retries until 21:40 KST. A run exits in seconds once the session is already in.
    - cron: '10,40 8-12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 이미 반영된 거래일도 다시 수집
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: wamo-data-update
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 최신 파일 가져오기
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 도구 설치
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 일본·대만 엔진 검사
        run: python -m unittest -v tests.test_asia
      - name: Git 저장 준비
        run: |
          git config user.name 'wamo-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
      - name: 일본·대만 수집·레이더 반영
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -u wamo_asia.py --publish $FORCE
