name: KIS read-only integration check
on:
  push:
    branches: ['codex/kis-integration-20260907']
    paths: ['wamo_kis_check.py', '.github/workflows/kis-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wamo-kis-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests exchange_calendars
      - name: Read-only quote and estimate schema
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SEC: ${{ secrets.KIS_APP_SEC || secrets.KIS_APP_SECRET }}
        run: python -u wamo_kis_check.py
