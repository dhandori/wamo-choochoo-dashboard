name: SEC 연결 점검
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: SEC 티커 목록·재무자료 직접 받아 보기
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_CONTACT && format('WAMO-Market-Radar {0}', secrets.SEC_CONTACT) || secrets.SEC_USER_AGENT }}
        run: python -u wamo_sec_check.py
