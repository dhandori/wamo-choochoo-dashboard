name: Pages 배포 연습 (작업 갈래 전용)
# 사이트를 바꾸지 않는다. main을 사이트용 꾸러미로 포장해 보고 지금 사이트와 같은지 비교만 한다.
# 새 배포 방식(자료를 data 서랍으로 분리)으로 옮기기 전의 안전 확인용이다.
on:
  push:
    branches: [ccr-c1dab37a-a0z1k6]
    paths:
      - .github/workflows/pages-dryrun.yml
      - tools/pages_package.py
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-dryrun
  cancel-in-progress: true
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 도구 받기 (이 작업 갈래)
        uses: actions/checkout@v6
        with:
          path: branch
      - name: 지금 사이트의 원본(main) 받기
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src
          fetch-depth: 40
      - name: 배포 꾸러미 만들기
        run: python3 -I branch/tools/pages_package.py build main-src _site --manifest manifest.json --min-files 100 --require index.html:10000 --require us.html:10000 --require radar.html:10000
      - name: 꾸러미 포장 검사 (공식 도구로 포장만 하고 배포는 하지 않음)
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - name: 지금 사이트와 비교
        run: |
          git -C main-src fetch --depth=40 origin main
          python3 -I branch/tools/pages_package.py compare main-src manifest.json https://dhandori.github.io/wamo-choochoo-dashboard --ref origin/main --report report.json
      - name: Pages 설정 방식 읽기 (클릭 후 자동으로 켜지게 할 수 있는지 시험)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- 설정 읽기 시도"
          gh api "repos/${{ github.repository }}/pages" --jq '{build_type, html_url, source}' 2>&1 | head -20 || true
      - name: 비교 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-dryrun-report
          path: report.json
          if-no-files-found: ignore
          retention-days: 3
